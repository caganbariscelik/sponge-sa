<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPONGE-SA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap">
<style>
:root{--bg:#eaf1ef;--card:#fff;--ink:#12302e;--mut:#5d7471;--line:#cfdcd9;--a:#5b6b7a;--b:#1f8a64;--warn:#c98a00;--bad:#d2553f;--ok:#1f8a64;--wat:#2f80d0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1918;--card:#162624;--ink:#e3f0ed;--mut:#8fa9a5;--line:#2a3f3d;--a:#9aaebf;--b:#4fc79a;--warn:#e0b040;--bad:#ee7a64;--ok:#4fc79a;--wat:#6db3f2}}
:root[data-theme="dark"]{--bg:#0d1918;--card:#162624;--ink:#e3f0ed;--mut:#8fa9a5;--line:#2a3f3d;--a:#9aaebf;--b:#4fc79a;--warn:#e0b040;--bad:#ee7a64;--ok:#4fc79a;--wat:#6db3f2}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Schibsted Grotesk",system-ui,sans-serif}
.hero{background:linear-gradient(145deg,#06303c,#0b5a55 60%,#1f8a64);color:#fff;padding:28px 20px 70px;position:relative;overflow:hidden}
.hero>div{max-width:560px;margin:0 auto;position:relative}
.badge{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;border:1px solid rgba(255,255,255,.4);padding:4px 10px;border-radius:20px;margin-bottom:12px}
h1{font-size:40px;line-height:1;font-weight:800;margin:0 0 8px;letter-spacing:-.02em}
.tag1{font-size:17px;opacity:.92;margin:0;max-width:30ch}
.waves{position:absolute;left:0;bottom:-1px;width:200%;height:46px;animation:mv 9s linear infinite}
@keyframes mv{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.waves{animation:none}}
.drop{position:absolute;right:20px;top:26px;opacity:.9}
main{max-width:560px;margin:-34px auto 0;padding:0 16px 40px;position:relative}
nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:14px;margin-bottom:16px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px 2px;border-radius:10px;font:600 13px inherit;font-family:inherit;cursor:pointer}
nav button[aria-selected=true]{background:var(--b);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
h2{font-size:20px;line-height:1.2;margin:0 0 8px}
p{margin:0 0 10px}
.mut{color:var(--mut);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mod{border:2px solid var(--line);border-radius:14px;padding:12px;font-size:14px;background:var(--card)}
.mod.a{border-color:var(--a)}.mod.b{border-color:var(--b)}
.mod h3{margin:0 0 8px;font-size:15px}
.dia{height:74px;border-radius:8px;background:var(--bg);position:relative;overflow:hidden;margin-bottom:8px}
.slab{position:absolute;left:8%;right:8%;top:38px;height:12px;background:var(--a);border-radius:3px;transform:rotate(-7deg)}
.dr{position:absolute;top:6px;font-size:14px}
.lay{position:absolute;left:8%;right:8%;bottom:6px;top:26px;display:flex;flex-direction:column;border-radius:4px;overflow:hidden}
.lay<!DOCTYPE html>
